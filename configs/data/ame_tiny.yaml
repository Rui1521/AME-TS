# AME-Tiny pre-training data: GIFT-Eval train split plus synthetic and LOTSA M5 series, sampled by weight

_target_: amets.data.builder.gift_eval.GiftEvalDatasetBuilder

datasets:
  # M4 Competition (Econ/Fin)
  - m4_yearly
  - m4_quarterly
  - m4_monthly
  - m4_weekly
  - m4_daily
  - m4_hourly

  # Electricity (Energy)
  - electricity/15T
  - electricity/H
  - electricity/D
  - electricity/W

  # Solar (Energy)
  - solar/10T
  - solar/H
  - solar/D
  - solar/W

  # Weather (Nature)
  - jena_weather/10T
  - jena_weather/H
  - jena_weather/D
  - temperature_rain_with_missing

  # ETT (Energy)
  - ett1/15T
  - ett1/H
  - ett1/D
  - ett1/W
  - ett2/15T
  - ett2/H
  - ett2/D
  - ett2/W

  # Traffic (Transport)
  - LOOP_SEATTLE/5T
  - LOOP_SEATTLE/H
  - LOOP_SEATTLE/D
  - SZ_TAXI/15T
  - SZ_TAXI/H
  - M_DENSE/H
  - M_DENSE/D

  # Healthcare
  - hospital
  - covid_deaths
  - us_births/D
  - us_births/M
  - us_births/W

  # Sales
  - restaurant
  - hierarchical_sales/D
  - hierarchical_sales/W

  # Nature
  - saugeenday/D
  - saugeenday/M
  - saugeenday/W
  - kdd_cup_2018_with_missing/H
  - kdd_cup_2018_with_missing/D

  # Web/CloudOps (multivariate)
  - bitbrains_fast_storage/5T
  - bitbrains_fast_storage/H
  - bitbrains_rnd/5T
  - bitbrains_rnd/H
  - bizitobs_application
  - bizitobs_service
  - bizitobs_l2c/5T
  - bizitobs_l2c/H

  # Synthetic and LOTSA M5
  - synthetic
  - lotsa_m5

