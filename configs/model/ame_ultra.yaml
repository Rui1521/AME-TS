# AME-Ultra model: d1024, 6 layers, 10 experts, top-2

_target_: amets.model.pretrain.AMETSPretrain

module_kwargs:
  _target_: builtins.dict
  d_model: 1024
  num_layers: 6
  patch_sizes: ${as_tuple:[4, 8, 16, 32, 64, 128]}
  max_seq_len: 1024
  attn_dropout_p: 0.1
  dropout_p: 0.1
  scaling: true
  num_experts: 10
  num_experts_per_tok: 2

min_patches: 2
min_mask_ratio: 0.1
max_mask_ratio: 0.6
max_dim: 128

loss_type: "l1"
recon_loss_coef: 1.0

lr: 5e-4
weight_decay: 0.01
beta1: 0.9
beta2: 0.98
num_training_steps: ${mul:${trainer.max_epochs},${train_dataloader.num_batches_per_epoch}}
num_warmup_steps: 10000
scheduler_type: "linear"
num_cycles: 1

regime_predictor_path: ${oc.env:AMETS_ROOT}/regime_predictor/trained_predictors/regime_predictor_combined.pt
freeze_regime_predictor: true
lambda_max: 1.0
l0: 0
lambda_schedule: "linear_increase"
num_regimes: 4
pre_norm: true
time_recency_bias: false

routing_mode: "kl_divergence"
kl_loss_coef: 100.0
lb_loss_coef: 0.0
ortho_loss_coef: 0.1
kl_divergence_type: "forward"

shared_gate_mode: "fixed"
shared_gate_alpha: 1.0
shared_gate_beta: 0.5
